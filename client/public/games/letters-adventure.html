<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7bd3f7">
<title>مغامرة الحروف | ABC Adventure</title>
<style>
/* ============ الأساسيات ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Segoe UI","Comic Sans MS","Tajawal","Noto Naskh Arabic",system-ui,sans-serif;
  background:linear-gradient(180deg,#8fdcff 0%,#c9f0ff 45%,#fff3cf 100%) fixed;
  color:#20303a;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  min-height:100%;
}
#app{max-width:820px;margin:0 auto;padding:10px 12px 26px;position:relative}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}

/* ============ الشريط العلوي ============ */
header{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(19px,5.2vw,27px);letter-spacing:.3px}
.logo .mark{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.10);display:grid;place-items:center;font-size:22px;color:#ff6b6b}
.stars{margin-inline-start:auto;display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;
  padding:7px 14px;box-shadow:0 4px 0 rgba(0,0,0,.08);font-weight:900;font-size:18px}
.stars .ic{font-size:19px}
.iconbtn{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);
  display:grid;place-items:center;font-size:20px;font-weight:800}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
#langBtn{width:auto;padding:0 14px;font-size:16px;letter-spacing:1px}

/* ============ بطاقات الأقسام ============ */
.card{background:#fff;border-radius:28px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.07);margin-bottom:14px}
.screen{display:none;animation:pop .25s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:24px;padding:20px 14px 18px;color:#fff;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.14);
  transition:transform .12s}
.mode:active{transform:translateY(5px) scale(.99);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.mode .em{font-size:44px;line-height:1;display:block;margin-bottom:8px}
.mode b{display:block;font-size:clamp(17px,4.6vw,22px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.mode span{display:block;font-size:13px;opacity:.95;margin-top:5px;line-height:1.5}
.m-learn{background:linear-gradient(160deg,#ff9f43,#ff6b6b)}
.m-match{background:linear-gradient(160deg,#26c6da,#3d8bff)}
.m-listen{background:linear-gradient(160deg,#a55eea,#6c5ce7)}
.m-write{background:linear-gradient(160deg,#2ecc71,#12a15b)}

/* ============ شبكة الحروف ============ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(min-width:560px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .1s;overflow:hidden}
.tile:active{transform:translateY(3px) scale(.98)}
.tile .lt{font-size:clamp(26px,8vw,34px);font-weight:900;line-height:.9;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile .sm{font-size:13px;font-weight:800;opacity:.9}
.tile svg{width:56%;height:44%;margin:0 auto;display:block}
.tile.sel{outline:4px solid #ffe066;outline-offset:-4px}

/* ============ بطاقة الحرف الكبير ============ */
.letterview{text-align:center;margin-top:14px}
.lv-top{display:flex;align-items:center;justify-content:center;gap:6px}
.lv-lt{font-size:clamp(70px,26vw,140px);font-weight:900;line-height:.95;color:#ff6b6b;text-shadow:0 6px 0 rgba(0,0,0,.08)}
.lv-lt small{display:block;font-size:.34em;font-weight:900;opacity:.75}
.lv-stage{background:#f3fbff;border-radius:26px;padding:6px 10px 0;margin-top:4px}
.lv-stage svg{width:min(58vw,250px);height:min(58vw,250px);display:block;margin:0 auto}
.lv-word{font-size:clamp(28px,9vw,44px);font-weight:900;letter-spacing:1px;margin:2px 0 0}
.lv-ar{font-size:clamp(17px,5vw,22px);color:#5b6b76;font-weight:700;margin:2px 0 10px}
.lv-phon{display:inline-block;background:#fff2c2;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px;margin-bottom:10px}

/* ============ أزرار ============ */
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn{background:#ffd23f;color:#3a2b00;font-weight:900;font-size:clamp(15px,4.3vw,19px);padding:13px 20px;border-radius:999px;
  box-shadow:0 5px 0 rgba(0,0,0,.13)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.13)}
.btn.alt{background:#fff;color:#20303a}
.btn.go{background:#3d8bff;color:#fff}
.btn.big{width:100%;font-size:clamp(18px,5.5vw,24px);padding:16px}
.ttl{font-size:clamp(19px,5.4vw,25px);font-weight:900;margin:2px 2px 12px;display:flex;align-items:center;gap:8px}
.hint{font-size:14px;color:#5b6b76;text-align:center;margin:0 0 10px;font-weight:700}

/* ============ لعبة المطابقة ============ */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border-radius:20px;background:#f3f7fa;border:4px solid #dfe9f0;display:grid;place-items:center;
  aspect-ratio:1;padding:8px;transition:transform .12s,background .2s,border-color .2s}
.pcard:active{transform:scale(.97)}
.pcard svg{width:78%;height:78%}
.pcard .lt{font-size:clamp(40px,13vw,64px);font-weight:900;color:#3d8bff}
.pcard.pick{background:#fff2c2;border-color:#ffd23f}
.pcard.done{background:#e6f9ec;border-color:#2ecc71;opacity:.75}
.pcard.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ============ لعبة الاستماع ============ */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.opt{aspect-ratio:1;border-radius:22px;display:grid;place-items:center;color:#fff;font-weight:900;
  font-size:clamp(44px,15vw,74px);box-shadow:0 6px 0 rgba(0,0,0,.14);text-shadow:0 3px 0 rgba(0,0,0,.15)}
.opt:active{transform:translateY(4px)}
.opt.good{background:#2ecc71!important;animation:jump .5s}
.opt.bad{background:#cfd8dd!important;animation:shake .4s}
@keyframes jump{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.hero{background:#f3fbff;border-radius:24px;padding:14px;text-align:center}
.hero .big-ear{font-size:62px;line-height:1}
.bar{height:14px;background:#e9f1f6;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ecc71,#a3e05a);border-radius:999px;transition:width .4s}

/* ============ الكتابة بالإصبع ============ */
#pad{display:block;width:100%;height:auto;background:#fff;border-radius:24px;border:4px dashed #cfe0ec;touch-action:none}

/* ============ شريط التنقل السفلي ============ */
nav{position:sticky;bottom:8px;display:flex;gap:6px;justify-content:center;background:#ffffffdd;backdrop-filter:blur(6px);
  border-radius:999px;padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.07);margin-top:6px}
nav .nb{flex:1;max-width:120px;border-radius:999px;padding:10px 4px;font-weight:900;font-size:13px;color:#5b6b76;text-align:center}
nav .nb.on{background:#3d8bff;color:#fff}

/* ============ الاحتفال ============ */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cft{position:absolute;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.85}}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) scale(.8);background:#20303a;color:#fff;
  padding:12px 22px;border-radius:999px;font-weight:900;font-size:17px;opacity:0;transition:.25s;z-index:70;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.winscreen{text-align:center;padding:22px 14px}
.winscreen .wem{font-size:76px;animation:jump 1.2s infinite}
.winscreen h2{font-size:clamp(24px,7vw,34px);margin:8px 0 4px}
.winstars{font-size:34px;letter-spacing:6px;margin:6px 0 14px}
footer{text-align:center;font-size:12px;color:#4b6270;opacity:.8;margin-top:8px;line-height:1.8}
</style>
<style>
.site-return{position:fixed;z-index:99999;top:12px;left:14px;display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(14,30,40,.82);backdrop-filter:blur(10px);color:#fff;text-decoration:none;font:700 12px system-ui,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.18);transition:.2s}
.site-return:hover{background:#efbd86;color:#17212b;transform:translateY(-2px)}
</style></head>

<div id="confetti"></div>
<div id="toast"></div>

<div id="app">
  <header>
    <div class="logo"><div class="mark">A</div><div id="appTitle">مغامرة الحروف</div></div>
    <div class="stars"><span class="ic">⭐</span><span id="starCount">0</span></div>
    <button class="iconbtn" id="soundBtn" title="sound">🔊</button>
    <button class="iconbtn" id="langBtn">EN</button>
  </header>

  <!-- ================= الرئيسية ================= -->
  <section class="screen on" id="s-home">
    <div class="card" style="background:linear-gradient(160deg,#ffe9a8,#ffd6e0)">
      <div style="font-size:clamp(20px,5.6vw,26px);font-weight:900;text-align:center;line-height:1.6" id="tagline"></div>
    </div>
    <div class="modes">
      <button class="mode m-learn"  data-go="learn"><span class="em">🔤</span><b data-t="learn_t"></b><span data-t="learn_s"></span></button>
      <button class="mode m-match"  data-go="match"><span class="em">🧩</span><b data-t="match_t"></b><span data-t="match_s"></span></button>
      <button class="mode m-listen" data-go="listen"><span class="em">👂</span><b data-t="listen_t"></b><span data-t="listen_s"></span></button>
      <button class="mode m-write"  data-go="write"><span class="em">✏️</span><b data-t="write_t"></b><span data-t="write_s"></span></button>
    </div>
    <div class="card">
      <div class="ttl" id="parentsTtl">👨‍👩‍👧 للوالدين والمعلّم</div>
      <div id="parentsTxt" style="font-size:14px;line-height:1.9;color:#42565f"></div>
    </div>
  </section>

  <!-- ================= تعلّم ================= -->
  <section class="screen" id="s-learn">
    <div class="card">
      <div class="ttl">🔤 <span data-t="learn_t"></span></div>
      <div class="grid" id="letterGrid"></div>
      <div class="letterview">
        <div class="lv-top"><div class="lv-lt" id="lvLt"></div></div>
        <div class="lv-stage"><div id="lvPic"></div></div>
        <div class="lv-word" id="lvWord"></div>
        <div class="lv-ar" id="lvAr"></div>
        <div class="lv-phon" id="lvPhon"></div>
        <div class="row">
          <button class="btn go" id="sayBtn">🔊 <span data-t="say_letter"></span></button>
          <button class="btn alt" id="slowBtn">🐢 <span data-t="slow"></span></button>
        </div>
        <div class="row">
          <button class="btn alt" id="prevBtn">◀</button>
          <button class="btn alt" id="replayBtn">🔁 <span data-t="say_word"></span></button>
          <button class="btn alt" id="nextBtn">▶</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= مطابقة ================= -->
  <section class="screen" id="s-match">
    <div class="card">
      <div class="ttl">🧩 <span data-t="match_t"></span></div>
      <p class="hint" data-t="match_h"></p>
      <div class="bar"><i id="matchBar"></i></div>
      <div class="matchwrap" id="matchWrap"></div>
      <div class="row"><button class="btn alt" id="matchNew">🔄 <span data-t="newround"></span></button></div>
    </div>
  </section>

  <!-- ================= استماع ================= -->
  <section class="screen" id="s-listen">
    <div class="card">
      <div class="ttl">👂 <span data-t="listen_t"></span></div>
      <div class="hero">
        <div class="big-ear">🦻</div>
        <div style="font-weight:900;font-size:17px;margin:4px 0 10px" data-t="listen_q"></div>
        <div class="row" style="margin:0">
          <button class="btn go" id="earBtn">🔊 <span data-t="listen_play"></span></button>
          <button class="btn alt" id="earSlowBtn">🐢 <span data-t="slow"></span></button>
        </div>
      </div>
      <div class="bar"><i id="listenBar"></i></div>
      <div class="opts" id="listenOpts"></div>
      <div class="row"><button class="btn alt" id="listenNew">🔄 <span data-t="newround"></span></button></div>
    </div>
  </section>

  <!-- ================= كتابة ================= -->
  <section class="screen" id="s-write">
    <div class="card">
      <div class="ttl">✏️ <span data-t="write_t"></span></div>
      <p class="hint" data-t="write_h"></p>
      <div class="row" style="margin-bottom:10px">
        <button class="btn alt" id="wPrev">◀</button>
        <button class="btn go" id="wSay">🔊 <span data-t="say_letter"></span></button>
        <button class="btn alt" id="wNext">▶</button>
      </div>
      <canvas id="pad"></canvas>
      <div class="row">
        <button class="btn alt" id="wClear">🧽 <span data-t="write_clear"></span></button>
        <button class="btn" id="wDone">✅ <span data-t="write_done"></span></button>
      </div>
    </div>
  </section>

  <!-- ================= الفوز ================= -->
  <section class="screen" id="s-win">
    <div class="card winscreen">
      <div class="wem">🏆</div>
      <h2 data-t="win_t"></h2>
      <div class="winstars" id="winStars"></div>
      <div style="font-weight:800;color:#5b6b76;margin-bottom:14px" id="winMsg"></div>
      <div class="row" style="flex-direction:column">
        <button class="btn big go" id="againBtn" data-t="again"></button>
        <button class="btn big alt" id="homeBtn" data-t="home"></button>
      </div>
    </div>
  </section>

  <nav>
    <button class="nb on" data-go="home" data-t="home"></button>
    <button class="nb" data-go="learn" data-t="learn_short"></button>
    <button class="nb" data-go="match" data-t="match_short"></button>
    <button class="nb" data-go="listen" data-t="listen_short"></button>
    <button class="nb" data-go="write" data-t="write_short"></button>
  </nav>

  <footer id="foot"></footer>
</div>

/* ---------- 3) حالة اللعبة ---------- */
let LANG = localStorage.getItem("abc_lang") || "ar";
let SOUND = localStorage.getItem("abc_sound") !== "0";
let stars = parseInt(localStorage.getItem("abc_stars") || "0", 10);
let cur = 0;               // الحرف الحالي في وضع الاستكشاف
let t = I18N.ar;           // قاموس النصوص الحالي

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; };
const word = i => LETTERS[i].w.toLowerCase();

/* ---------- 4) الصوت: مؤثرات + نطق ---------- */
let ac = null;
function audio(){ if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); } return ac; }
function tone(freq, dur, type, delay, gain){
  const c = audio(); if (!c || !SOUND) return;
  if (c.state === "suspended") c.resume();
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  const t0 = c.currentTime + (delay || 0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.16, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  tap:  () => tone(520, .09, "triangle", 0, .10),
  good: () => { tone(660, .12, "sine", 0, .18); tone(880, .14, "sine", .10, .16); tone(1180, .18, "sine", .22, .13); },
  bad:  () => { tone(220, .16, "sawtooth", 0, .09); tone(170, .2, "sawtooth", .1, .07); },
  win:  () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .26, "triangle", i * .13, .16))
};
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceFor(lang){
  const want = lang.slice(0, 2).toLowerCase();
  const good = voices.filter(v => (v.lang || "").toLowerCase().slice(0, 2) === want);
  if (!good.length) return null;
  const pri = ["female", "zira", "samantha", "google", "natural", "enhanced"];
  good.sort((a, b) => {
    const s = v => { const k = (v.name || "").toLowerCase(); return pri.reduce((n, p) => n + (k.includes(p) ? 1 : 0), 0); };
    return s(b) - s(a);
  });
  return good[0];
}
function speak(text, lang, rate){
  if (!SOUND || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v;
    u.rate = rate || 1; u.pitch = lang.startsWith("ar") ? 1.05 : 1.25;
    speechSynthesis.speak(u);
  } catch (e) { /* المتصفح لا يدعم النطق — اللعبة تعمل بدونه */ }
}
const sayLetter = (i, slow) => { const L = LETTERS[i]; speak(L.l + ".  " + word(i) + ".", "en-US", slow ? .55 : .95); };
const saySound  = (i, slow) => { speak(LETTERS[i].s, "en-US", slow ? .45 : .8); };
const sayAr     = txt => speak(txt, "ar-SA", .95);
function praise(force){
  if (force === "bad") { sfx.bad(); if (SOUND && LANG === "ar") sayAr("حاول مرة أخرى"); return; }
  sfx.good();
  if (SOUND) speak(pick(LANG === "ar" ? ["أحسنت", "ممتاز", "رائع", "يا ذكي"] : I18N.en.great), LANG === "ar" ? "ar-SA" : "en-US", 1);
}

/* ---------- 5) النجوم والاحتفال ---------- */
function addStar(n){
  stars += (n || 1);
  $("#starCount").textContent = stars;
  localStorage.setItem("abc_stars", String(stars));
}
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1100);
}
const CC = ["#ff6b6b", "#ffd23f", "#2ecc71", "#3d8bff", "#a55eea", "#ff9f43", "#22b8cf"];
function confetti(count){
  const box = $("#confetti");
  for (let i = 0; i < (count || 60); i++) {
    const d = document.createElement("i");
    d.className = "cft";
    d.style.left = rnd(100) + "vw";
    d.style.top = (-10 - rnd(30)) + "px";
    d.style.background = pick(CC);
    d.style.animationDuration = (1.6 + Math.random() * 1.7) + "s";
    d.style.animationDelay = (Math.random() * .5) + "s";
    if (rnd(2)) d.style.borderRadius = "50%";
    box.appendChild(d);
    setTimeout(() => d.remove(), 4200);
  }
}
function celebrate(msg){
  confetti(80); sfx.win(); if (msg) toast(msg);
}

/* ---------- 6) التنقل واللغة ---------- */
function go(name){
  $$(".screen").forEach(s => s.classList.toggle("on", s.id === "s-" + name));
  $$(".nb").forEach(b => b.classList.toggle("on", b.dataset.go === name));
  if (name === "match") startMatch();
  if (name === "listen") startListen();
  if (name === "write") setupPad();
  window.scrollTo(0, 0);
}
function applyLang(){
  t = I18N[LANG];
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("#appTitle").textContent = t.title;
  $("#tagline").innerHTML = t.tag;
  $$("[data-t]").forEach(el => { const k = el.dataset.t; if (t[k]) el.textContent = t[k]; });
  $("#langBtn").textContent = LANG === "ar" ? "EN" : "عربي";
  $("#parentsTxt").innerHTML = "✅ " + t.p1 + "<br>🔊 " + t.p2 + "<br>🧭 " + t.p3 + "<br>🎓 " + t.p4;
  $("#parentsTtl").textContent = LANG === "ar" ? "👨‍👩‍👧 للوالدين والمعلّم" : "👨‍👩‍👧 For parents & teachers";
  $("#foot").textContent = t.foot;
  document.title = (LANG === "ar" ? "مغامرة الحروف | ABC Adventure" : "ABC Adventure | مغامرة الحروف");
  renderLearn(); renderMatch(); renderListen(); drawPad();
}

/* ---------- 7) شاشة الاستكشاف ---------- */
function renderLearn(){
  const g = $("#letterGrid");
  g.innerHTML = LETTERS.map((L, i) =>
    '<button class="tile' + (i === cur ? " sel" : "") + '" data-i="' + i + '" style="background:' + L.c + '">' +
      '<div><div class="lt">' + L.l + '</div><div class="sm">' + L.l.toLowerCase() + '</div></div>' +
    '</button>').join("");
  $$("#letterGrid .tile").forEach(b => b.addEventListener("click", () => {
    cur = +b.dataset.i; markSel(); showLetter(); sfx.tap(); sayLetter(cur);
  }));
  showLetter();
}
function markSel(){ $$("#letterGrid .tile").forEach(b => b.classList.toggle("sel", +b.dataset.i === cur)); }
function step(d){ cur = (cur + d + LETTERS.length) % LETTERS.length; markSel(); showLetter(); }
function showLetter(){
  const L = LETTERS[cur];
  const el = $("#lvLt"); el.style.color = L.c;
  el.innerHTML = L.l + '<small>' + L.l.toLowerCase() + '</small>';
  $("#lvPic").innerHTML = L.svg;
  $("#lvWord").textContent = L.w;
  $("#lvWord").lang = "en";
  $("#lvAr").textContent = LANG === "ar" ? L.ar : word(cur);
  $("#lvPhon").textContent = "🔉 " + L.s;
  markSel();
}

/* ---------- 8) لعبة المطابقة ---------- */
const MATCH_N = 3;
let mState = { idx: [], sel: null, done: 0 };
function startMatch(){
  const set = shuffle(LETTERS.map((x, i) => i)).slice(0, MATCH_N).sort((a, b) => a - b);
  mState = { idx: set, letters: shuffle(set), pics: shuffle(set), sel: null, done: 0 };
  renderMatch();
}
function renderMatch(){
  const w = $("#matchWrap"); if (!w) return;
  if (!mState.idx.length) return;
  const colA = (LANG === "ar" ? "pics" : "letters");
  const letters = mState.letters.map(i => '<button class="pcard' + (mState.doneIdx && mState.doneIdx.indexOf(i) > -1 ? " done" : "") + '" data-k="L' + i + '" data-i="' + i + '"><span class="lt">' + LETTERS[i].l + '</span></button>');
  const pics = mState.pics.map(i => '<button class="pcard' + (mState.doneIdx && mState.doneIdx.indexOf(i) > -1 ? " done" : "") + '" data-k="P' + i + '" data-i="' + i + '">' + LETTERS[i].svg + '</button>');
  const first = colA === "pics" ? pics : letters, second = colA === "pics" ? letters : pics;
  w.innerHTML = first.join("") + second.join("");
  $$("#matchWrap .pcard").forEach(b => b.addEventListener("click", () => onMatchTap(b)));
  if (!mState.doneIdx) mState.doneIdx = [];
  $("#matchBar").style.width = (mState.done / MATCH_N * 100) + "%";
}
function onMatchTap(btn){
  if (btn.classList.contains("done")) return;
  sfx.tap();
  const i = +btn.dataset.i, kind = btn.dataset.k[0];
  if (!mState.sel) { mState.sel = { i: i, kind: kind, btn: btn }; btn.classList.add("pick"); return; }
  if (mState.sel.btn === btn) { btn.classList.remove("pick"); mState.sel = null; return; }
  const same = mState.sel.i === i && mState.sel.kind !== kind;
  if (same) {
    mState.sel.btn.classList.remove("pick");
    mState.sel.btn.classList.add("done"); btn.classList.add("done");
    mState.doneIdx.push(i); mState.done++;
    addStar(1); praise(); speak(word(i), "en-US", 1);
    $("#matchBar").style.width = (mState.done / MATCH_N * 100) + "%";
    mState.sel = null;
    if (mState.done >= MATCH_N) { addStar(2); setTimeout(() => celebrate(LANG === "ar" ? "طابقت كل الحروف! ⭐⭐" : "All matched! ⭐⭐"), 500); }
  } else {
    const a = mState.sel.btn;
    a.classList.remove("pick"); btn.classList.add("bad"); a.classList.add("bad");
    mState.sel = null;
    praise("bad");
    setTimeout(() => { btn.classList.remove("bad"); a.classList.remove("bad"); }, 450);
  }
}

/* ---------- 9) لعبة الاستماع ---------- */
const LISTEN_N = 6;
let lState = { q: 0, right: 0, ans: 0 };
function startListen(){ lState = { q: 0, right: 0, ans: 0 }; nextListen(); }
function nextListen(){
  if (lState.q >= LISTEN_N) {
    showWin(lState.right);
    return;
  }
  $("#listenBar").style.width = (lState.q / LISTEN_N * 100) + "%";
  const ans = rnd(LETTERS.length);
  const opts = shuffle([ans, (ans + 1 + rnd(24)) % 26, (ans + 9 + rnd(16)) % 26].filter((v, ix, a) => a.indexOf(v) === ix));
  while (opts.length < 3) { const c = rnd(26); if (opts.indexOf(c) < 0 && c !== ans) opts.push(c); }
  lState.ans = ans;
  const box = $("#listenOpts");
  box.innerHTML = shuffle(opts).map(i => '<button class="opt" data-i="' + i + '" style="background:' + LETTERS[i].c + '">' + LETTERS[i].l + '</button>').join("");
  $$("#listenOpts .opt").forEach(b => b.addEventListener("click", () => onListen(b, +b.dataset.i === ans)));
  setTimeout(() => saySound(ans), 380);
}
function onListen(btn, ok){
  if (btn.disabled) return;
  $$("#listenOpts .opt").forEach(b => b.disabled = true);
  if (ok) {
    btn.classList.add("good"); addStar(2); lState.right++; praise();
    speak(LETTERS[lState.ans].l + ". " + word(lState.ans), "en-US", .95);
    lState.q++;
    setTimeout(() => { $$("#listenOpts .opt").forEach(b => b.disabled = false); nextListen(); }, 1250);
  } else {
    btn.classList.add("bad"); praise("bad");
    setTimeout(() => { btn.classList.remove("bad"); $$("#listenOpts .opt").forEach(b => b.disabled = false); }, 900);
  }
}

/* ---------- 10) التعيين على الشاشة (الكتابة بالإصبع) ---------- */
let padInk = "#3d8bff";
function setupPad(){
  const c = $("#pad"); if (!c) return;
  const box = c.parentElement.getBoundingClientRect();
  const w = Math.max(240, Math.floor(box.width - 32));
  const h = Math.min(w, 380);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr;
  c.style.height = h + "px";
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPad();
}
function drawPad(){
  const c = $("#pad"); if (!c || !c.getContext) return;
  const g = c.getContext("2d");
  const w = c.width / Math.min(3, window.devicePixelRatio || 1), h = c.height / Math.min(3, window.devicePixelRatio || 1);
  g.clearRect(0, 0, w, h);
  /* خطوط مساعدة */
  g.strokeStyle = "#e3eef5"; g.lineWidth = 2;
  [h * .5].forEach(y => { g.setLineDash([12, 10]); g.beginPath(); g.moveTo(10, y); g.lineTo(w - 10, y); g.stroke(); });
  g.setLineDash([]);
  /* الحرف الكبير */
  const L = LETTERS[cur];
  const fs = Math.min(h * .82, w * .6);
  g.font = "900 " + fs + "px 'Comic Sans MS', 'Segoe UI', sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#f2f6f9"; g.fillText(L.l, w / 2, h / 2);
  g.strokeStyle = "#c9dbe6"; g.lineWidth = 3; g.setLineDash([14, 11]);
  g.strokeText(L.l, w / 2, h / 2); g.setLineDash([]);
  g.font = "900 " + (fs * .22) + "px 'Comic Sans MS', sans-serif";
  g.fillStyle = "#dfe9f0"; g.fillText(L.l.toLowerCase(), w * .16, h / 2);
  g.fillText(L.l.toUpperCase(), w * .84, h / 2);
  $("#wSayLabel") && ($("#wSayLabel").textContent = L.l);
}
function padEvents(){
  const c = $("#pad"); let drawing = false;
  const pos = e => {
    const r = c.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) || e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = e => {
    drawing = true; const g = c.getContext("2d"), p = pos(e);
    g.strokeStyle = padInk; g.lineWidth = 16; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + .1, p.y + .1); g.stroke();
    tone(700 + p.y, .05, "sine", 0, .05);
    e.preventDefault();
  };
  const move = e => {
    if (!drawing) return;
    const g = c.getContext("2d"), p = pos(e);
    g.lineTo(p.x, p.y); g.stroke(); e.preventDefault();
  };
  const end = () => { drawing = false; };
  c.addEventListener("mousedown", start); c.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  c.addEventListener("touchstart", start, { passive: false });
  c.addEventListener("touchmove", move, { passive: false });
  c.addEventListener("touchend", end);
}

/* ---------- 11) شاشة الفوز ---------- */
function showWin(n){
  $("#winStars").textContent = "⭐".repeat(Math.max(1, Math.min(5, n)));
  $("#winMsg").textContent = (LANG === "ar" ? "أجبت على " + n + " من " + LISTEN_N + " أسئلة" : "You answered " + n + " of " + LISTEN_N) + " — " + t.win_msg;
  $("#listenBar").style.width = "100%";
  go("win"); celebrate();
  speak(LANG === "ar" ? "أحسنت يا بطل" : "Great job, champion", LANG === "ar" ? "ar-SA" : "en-US", 1);
}

/* ---------- 12) ربط الأزرار ---------- */
function bind(){
  $$("[data-go]").forEach(b => b.addEventListener("click", () => { sfx.tap(); go(b.dataset.go); }));
  $("#langBtn").addEventListener("click", () => { LANG = LANG === "ar" ? "en" : "ar"; localStorage.setItem("abc_lang", LANG); applyLang(); sfx.tap(); });
  $("#soundBtn").addEventListener("click", () => {
    SOUND = !SOUND; localStorage.setItem("abc_sound", SOUND ? "1" : "0");
    $("#soundBtn").textContent = SOUND ? "🔊" : "🔇"; if (!SOUND && window.speechSynthesis) speechSynthesis.cancel();
  });
  $("#soundBtn").textContent = SOUND ? "🔊" : "🔇";
  $("#sayBtn").addEventListener("click", () => sayLetter(cur));
  $("#replayBtn").addEventListener("click", () => sayLetter(cur));
  $("#slowBtn").addEventListener("click", () => { sayLetter(cur, true); });
  $("#prevBtn").addEventListener("click", () => { sfx.tap(); step(LANG === "ar" ? 1 : -1); });
  $("#nextBtn").addEventListener("click", () => { sfx.tap(); step(LANG === "ar" ? -1 : 1); });
  $("#lvPic").addEventListener("click", () => sayLetter(cur));
  $("#lvWord").addEventListener("click", () => sayLetter(cur));
  $("#lvPhon").addEventListener("click", () => saySound(cur));
  $("#matchNew").addEventListener("click", () => { sfx.tap(); startMatch(); });
  $("#earBtn").addEventListener("click", () => saySound(lState.ans));
  $("#earSlowBtn").addEventListener("click", () => saySound(lState.ans, true));
  $("#listenNew").addEventListener("click", () => { sfx.tap(); startListen(); });
  $("#wPrev").addEventListener("click", () => { sfx.tap(); step(-1); });
  $("#wNext").addEventListener("click", () => { sfx.tap(); step(1); });
  $("#wSay").addEventListener("click", () => sayLetter(cur));
  $("#wClear").addEventListener("click", () => { setupPad(); sfx.tap(); });
  $("#wDone").addEventListener("click", () => {
    const c = $("#pad"); const g = c.getContext("2d");
    const d = g.getImageData(0, 0, c.width, c.height).data; let ink = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40 && d[i] < 120 && d[i + 2] > 120) ink++;
    if (ink > 600) { addStar(1); sfx.good(); sayLetter(cur); celebrate(LANG === "ar" ? "كتابة جميلة! ⭐" : "Lovely writing! ⭐"); step(1); }
    else { toast(LANG === "ar" ? "ارسم الحرف أولاً ✏️" : "Trace the letter first ✏️"); sfx.tap(); }
  });
  $("#againBtn").addEventListener("click", () => { sfx.tap(); lState.q = 0; lState.right = 0; go("listen"); });
  $("#homeBtn").addEventListener("click", () => { sfx.tap(); go("home"); });
  padEvents();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if ($("#s-write").classList.contains("on")) setupPad(); }, 200); });
}

/* ---------- 13) الإقلاع ---------- */
$("#starCount").textContent = stars;
bind(); applyLang(); renderLearn(); startMatch();
/* أول نقرة تفعّل الصوت (سياسة المتصفحات) */
document.addEventListener("pointerdown", function once(){ audio(); document.removeEventListener("pointerdown", once); }, { once: true });
</script>
